services:
  postgres:
    image: postgres:15-alpine
    container_name: shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop}
      POSTGRES_DB: ${DB_NAME:-shop}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-shop} -d ${DB_NAME:-shop}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shop_pgdata:
